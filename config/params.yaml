# =============================================================================
# SINGLE SOURCE OF TRUTH — Colombo UHI project parameters
# =============================================================================
# Every dataset ID, band name, scale factor, date range, threshold and CRS used
# anywhere in src/ or notebooks/ MUST be read from this file (CLAUDE.md rule:
# "No magic numbers in src/").
#
# Provenance tags used in the comments below:
#   [CLAUDE.md]    authoritative project-spec value
#   [GEE catalog]  verified against developers.google.com/earth-engine/datasets
#                  in the Browser pane on 2026-08-08 (see PROGRESS.md table)
#   [DEFAULT]      methodological default NOT fixed by CLAUDE.md — revisit at
#                  the phase noted before treating results as final
#
# NOTE: NOAA/GSOD station data is listed in CLAUDE.md but is NOT in the Earth
# Engine catalog (verified 2026-08-08: page 404s, catalog search returns no
# hits). It is therefore parked under `non_ee_sources` at the bottom of this
# file and NOT under `datasets`. See PROGRESS.md "Catalog discrepancies".
# =============================================================================

project:
  name: colombo-uhi
  title: "Urban Heat Island Intensity in Colombo, Sri Lanka (2000-2025)"
  python_min: "3.10"                  # [CLAUDE.md] target Python 3.10+

# --- Google Cloud / Earth Engine session -------------------------------------
gcp:
  # Earth Engine Cloud project id. Three ways to set (first non-empty wins):
  #   1. pass project_id="..." to colombo_uhi.auth.init_ee()
  #   2. set env var EE_PROJECT (in Colab: os.environ["EE_PROJECT"] = "...")
  #   3. this value (owner's project, set 2026-08-08)
  ee_project_id: "research-uhi-484404"

# --- Coordinate reference system + analysis grid -----------------------------
crs:
  analysis_epsg: "EPSG:32644"         # [CLAUDE.md] UTM zone 44N
  analysis_scale_m: 30                # [CLAUDE.md] 30 m analysis grid

# --- Study period + seasonal windows -----------------------------------------
time:
  start_year: 2000                    # [CLAUDE.md] study period 2000-2025
  end_year: 2025
  start_date: "2000-01-01"
  end_date: "2025-12-31"
  seasons:
    sw_monsoon:                       # [CLAUDE.md] SW monsoon May-Sep
      months: [5, 6, 7, 8, 9]
      label: "SW monsoon (May-Sep)"
    ne_monsoon:                       # [CLAUDE.md] NE monsoon Dec-Feb
      months: [12, 1, 2]
      label: "NE monsoon (Dec-Feb)"
    inter_monsoon:                    # [DEFAULT — Phase 2] the months CLAUDE.md leaves
      months: [3, 4, 10, 11]          # unnamed. SW(5-9) + NE(12,1,2) + inter(3,4,10,11) is a
      label: "Inter-monsoon"          # COMPLETE, NON-OVERLAPPING partition of all 12 months,
                                      # which is what landsat.monsoon_season() needs to tag
                                      # every scene exactly once (first two Sri Lanka
                                      # inter-monsoons: Mar-Apr and Oct-Nov).
    dry_window:                       # [CLAUDE.md] driest/clearest window; the
      months: [1, 2, 3]               # primary "dry season" comparison window
      label: "Dry season (Jan-Mar)"
      # NOTE: dry_window is a comparison WINDOW, not a season. It deliberately
      # overlaps ne_monsoon (Jan, Feb) and inter_monsoon (Mar). Only the three
      # seasons named in `season_partition` below partition the year.
  season_partition:                   # the ONLY entries landsat.monsoon_season() may iterate.
    - sw_monsoon                      # Together they cover months 1-12 exactly once. Never
    - ne_monsoon                      # derive this by iterating seasons.keys(): that would
    - inter_monsoon                   # include dry_window and map January to two seasons.

# --- Study area ---------------------------------------------------------------
aoi:
  centre: {lat: 6.93, lon: 79.85}     # [CLAUDE.md] Colombo centre
  koppen: "Af"                        # [CLAUDE.md] tropical rainforest/monsoon
  cmc_area_km2: 37                    # [CLAUDE.md] Colombo Municipal Council ~37 km2 (urban core)
  district:
    name: "Colombo"
    ds_divisions: 13                  # [CLAUDE.md] Divisional Secretariat divisions
    gn_divisions: 557                 # [CLAUDE.md] Grama Niladhari divisions
  western_province_districts:         # [CLAUDE.md]
    - "Colombo"
    - "Gampaha"
    - "Kalutara"
  water_bodies_to_mask:               # [CLAUDE.md] mask before any LST statistics
    - "Indian Ocean"
    - "Beira Lake"
    - "Bolgoda Lake"
    - "Kelani River"
    - "Diyawanna (Parliament) Lake"
  gaul:                               # [GEE catalog] property names verified
    country_property: "ADM0_NAME"
    country_value: "Sri Lanka"
    district_property: "ADM2_NAME"    # ADM2 = district level in GAUL
    district_value: "Colombo"
  assets:
    # Sub-district boundaries are NOT in GAUL (Sri Lanka GAUL stops at ADM2 =
    # district; verified 2026-08-08, decision recorded in PROGRESS.md).
    # Free source: OCHA/HDX "Sri Lanka - Subnational Administrative Boundaries"
    # (admin3 = DS divisions, admin4 = GN divisions). Download the shapefiles,
    # upload each as an EE table asset, then put the full asset ids here, e.g.
    #   "projects/research-uhi-484404/assets/lka_ds_divisions"
    # While these are null, aoi.ds_divisions()/gn_divisions() fall back to the
    # GAUL district with a prominent warning, and aoi.cmc_boundary() raises an
    # actionable error (notebook 01 has step-by-step upload instructions).
    ds_divisions: "projects/research-uhi-484404/assets/lka_admin3"
    gn_divisions: "projects/research-uhi-484404/assets/lka_admin4"
    # The uploaded assets cover ALL of Sri Lanka (339 DS / 14043 GN features)
    # and are OCHA COD-AB v03 with LOWERCASE field names — verified by
    # aoi.describe_asset() in the Colab run of 2026-08-08:
    #   adm3_name = DS name, adm4_name = GN name, adm2_name = parent district
    #   ("Colombo"), plus pcodes (adm2_pcode "LK11", adm3_pcode "LK1103") and
    #   area_sqkm. `adm*_name` is English (lang: en); adm*_name1 = Sinhala,
    #   adm*_name2 = Tamil — never filter on those.
    # Lowercase COD-AB names come FIRST; the uppercase/geoBoundaries variants
    # stay as fallbacks in case the assets are ever re-uploaded from another
    # source. aoi._resolve_property() takes the first candidate present and
    # raises with the asset's real property names if none match.
    # The pcode fields are a diacritic-proof alternative if names ever drift.
    ds_name_property_candidates: ["adm3_name", "ADM3_EN", "ADM_3_EN", "shapeName", "NAME_3", "DSD_N", "DSD_NAME"]
    gn_name_property_candidates: ["adm4_name", "ADM4_EN", "ADM_4_EN", "shapeName", "NAME_4", "GND_N"]
    district_property_candidates: ["adm2_name", "ADM2_EN", "ADM_2_EN", "NAME_2", "DISTRICT_N", "DISTRICT"]
    area_property: "area_sqkm"        # COD-AB carries its own area; the notebook cross-checks
                                      # the computed CMC area against the sum of these
    district_value: "Colombo"         # value of the district property for Colombo District;
                                      # when NO district property exists (geoBoundaries), the
                                      # loaders fall back to a centroid-within-GAUL spatial filter
  cmc:
    # CMC has no boundary in any GEE dataset, so it is dissolved from the
    # uploaded admin assets. Two definitions are supported:
    #
    #   gn_union  (DEFAULT, authoritative) — union of the 55 GN divisions that
    #     the Colombo Municipal Council itself lists as inside the CMC. Source:
    #     CMC GIS Unit / ID Center "GN DIVISIONS" map, supplied by the project
    #     owner 2026-08-08. Expected area ~37 km2 (gazetted 37.31).
    #   ds_union — union of the Colombo + Thimbirigasyaya DS divisions. This is
    #     the mapping most sources quote, but with COD-AB polygons it measures
    #     46.87 km2 (Colombo DS 24.54 + Thimbirigasyaya 22.33), ~10 km2 OVER the
    #     gazetted CMC: COD-AB's Colombo DS polygon encloses the Colombo Port
    #     outer harbour and breakwaters (confirmed visually in
    #     figures/aoi_water_mask_core.png, Colab run 3). No union of COD-AB DS
    #     polygons can yield 37 km2. Kept only as a sensitivity variant.
    definition: "gn_union"
    ds_division_names: ["Colombo", "Thimbirigasyaya"]
    ds_name_property: null            # null = auto-resolve from
                                      # aoi.assets.ds_name_property_candidates; set a string here
                                      # to override
    gn_name_property: null            # null = auto-resolve from
                                      # aoi.assets.gn_name_property_candidates
    expected_gn_count: 55             # every name below must match the asset; aoi.cmc_name_audit()
                                      # reports any that do not (a partial match would silently
                                      # shrink the CMC)
    parent_ds_scope: true             # Restrict GN selection to ds_division_names BEFORE matching
                                      # names. GN names are NOT unique within Colombo District:
                                      # matching across all 557 pulled in same-named divisions from
                                      # Dehiwala/Moratuwa/Kolonnawa and inflated the CMC to
                                      # 47.50 km2 for only 50 of 55 units — more than both parent DS
                                      # divisions combined (46.87 km2). Colab run 4, 2026-08-08.
    gn_division_names:                # the 55 GN divisions of the CMC, per the CMC GIS Unit map;
                                      # spellings reconciled against COD-AB adm4_name in run 4 —
                                      # five differ from the map's labels (marked below)
      - "Aluthkade East"
      - "Aluthkade West"
      - "Aluthmawatha"
      - "Bambalapitiya"
      - "Bloemendhal"
      - "Borella North"
      - "Borella South"
      - "Dematagoda"
      - "Fort"
      - "Galle Face"
      - "Gothamipura"
      - "Grandpass North"
      - "Grandpass South"
      - "Havelock Town"
      - "Hunupitiya"
      - "Ibbanwala"                   # CMC map spells it "Ibanwala"
      - "Jinthupitiya"
      - "Keselwatta"
      - "Khettarama"                  # CMC map spells it "Kettarama"
      - "Kirula"
      - "Kirulapone"                  # CMC map spells it "Kirulapona"
      - "Kochchikade North"
      - "Kochchikade South"
      - "Kollupitiya"
      - "Kotahena East"               # CMC map spells it "Kotehena East"
      - "Kotahena West"               # CMC map spells it "Kotehena West"
      - "Kuppiyawatta East"
      - "Kuppiyawatta West"
      - "Kurunduwatta"
      - "Lunupokuna"
      - "Madampitiya"
      - "Mahawatta"
      - "Maligakanda"
      - "Maligawatta East"
      - "Maligawatta West"
      - "Maradana"
      - "Masangasweediya"
      - "Mattakkuliya"
      - "Milagiriya"
      - "Modara"
      - "Narahenpita"
      - "Nawagampura"
      - "New Bazaar"
      - "Pamankada East"
      - "Pamankada West"
      - "Panchikawatta"
      - "Pettah"
      - "Sammanthranapura"
      - "Slave Island"
      - "Suduwella"
      - "Thimbirigasyaya"
      - "Wanathamulla"
      - "Wekanda"
      - "Wellawatta North"
      - "Wellawatta South"
  expected_areas_km2:                 # [DEFAULT — Phase 1] notebook sanity checks only;
                                      # GAUL is simplified at 500 m, expect a few % deviation
    # THREE different CMC numbers — never mix them up:
    cmc: 37                           # (a) gazetted CMC, 37.31. The external reference value.
    cmc_administrative: 47            # (b) the raw GN/DS polygon union (measured 47.07). Legitimately
                                      # EXCEEDS the gazetted figure: COD-AB's Colombo DS polygon
                                      # encloses the Colombo Port outer harbour — 6.89 km2 of water
                                      # sits inside it (Colab run 5; see
                                      # figures/aoi_water_mask_core.png). Not an error.
    cmc_land_at_30m: 40               # (c) polygon minus water at the 30 m analysis grid (40.18).
                                      # SCALE-DEPENDENT: the same quantity is 37.70 km2 at 300 m, a
                                      # 6.6% spread from raster discretisation of a ragged coastal
                                      # mask. Always quote the scale alongside the number; the
                                      # residual over 37.31 is COD-AB generalisation + the
                                      # aoi.water_mask thresholds, i.e. a sensitivity to report.
    district: 699
    western_province: 3684
  expected_counts:                    # [CLAUDE.md] within Colombo District, after filtering
    ds_divisions: 13
    gn_divisions: 557
  urban_extent:
    # Asset-free "urban extent" for the buffer-ring rural reference: GHSL built
    # surface above a threshold, vectorised. [DEFAULT — Phase 1] values.
    ghsl_epoch: 2020                  # GHSL 5-year epoch to use
    built_surface_threshold_m2: 2000  # >= 20% of the 100 m cell counts as built
    vectorize_scale_m: 100            # native GHSL resolution
  water_mask:
    # Combined water mask = MNDWI OR QA_PIXEL-water-frequency OR JRC occurrence.
    # All values [DEFAULT — Phase 1]; revisit before final statistics.
    mndwi_threshold: 0.0              # MNDWI > this = water (Xu 2006 default)
    qa_water_freq_threshold: 0.5      # fraction of clear obs with QA water bit set
    jrc_occurrence_threshold_pct: 50  # mirrors datasets.surface_water.occurrence_threshold_pct
    shoreline_buffer_m: 0             # optional dilation for coastal mixed pixels; 0 = off
    composite:                        # reflectance composite for MNDWI + QA frequency
      landsat_sources: ["landsat8", "landsat9"]   # keys under `datasets`
      start_year: 2023
      end_year: 2025
      months: [1, 2, 3]               # dry window = clearest skies
      reducer: "median"

# =============================================================================
