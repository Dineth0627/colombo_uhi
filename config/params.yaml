    type: image_collection
    sensor: "TM"
    st_band: "ST_B6"                  # [CLAUDE.md][GEE catalog] surface temperature, Kelvin after scaling
    availability: ["1984-03-16", "2012-05-05"]   # [GEE catalog]
    sr_bands:                         # [GEE catalog] for NDVI/NDBI/etc. in Phase 2
      blue: "SR_B1"
      green: "SR_B2"
      red: "SR_B3"
      nir: "SR_B4"
      swir1: "SR_B5"
      swir2: "SR_B7"
